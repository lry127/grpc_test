services:
  mysql:
    image: 'mysql:9.4'
    environment:
      - 'MYSQL_DATABASE=grpc_test_db'
      - 'MYSQL_PASSWORD=Ei1UP4bEd4ePfbTK'
      - 'MYSQL_ROOT_PASSWORD=tyKZw4X0Rz5IRwvN'
      - 'MYSQL_USER=springuser'
    volumes:
      - ./data/db/:/var/lib/mysql
    ports:
      - '127.0.0.1:3306:3306'

  phpmyadmin:
    image: 'phpmyadmin:5.2'
    environment:
      - 'PMA_HOST=mysql'
      - 'PMA_PORT=3306'
      - 'APACHE_PORT=8080'
      - 'PMA_USER=springuser'
      - 'PMA_PASSWORD=Ei1UP4bEd4ePfbTK'
    ports:
      - '127.0.0.1:8080:8080'

  redis:
    image: 'redis:8.2'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis_data:/data
